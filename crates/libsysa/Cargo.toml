[package]
name = "sysa"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[dependencies]
libsystema-sysa = { path = "../libsystema-sysa" }
libsystema-shared-rs = { path = "../../lib/libsystema-shared-rs" }
async-trait.workspace = true
bytes.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
colored.workspace = true
anyhow.workspace = true
gettext-rs.workspace = true
libc = "0.2"

# `notify` waits for the allocator's socket with an inotify watch on Linux;
# every other platform falls back to polling (see src/notify.rs).
[target.'cfg(any(target_os = "linux", target_os = "android"))'.dependencies]
inotify = "0.10"

[features]
default = []
l10n_debug = []
