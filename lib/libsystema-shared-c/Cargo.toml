[package]
name = "libsystema-shared-c"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

# `systema_shared_c` avoids colliding with the `systema_shared` lib target
# of `libsystema-shared-rs`, while keeping the Unix artifact names readable:
# `libsystema_shared_c.rlib`, `libsystema_shared_c.so` and
# `libsystema_shared_c.a`.
[lib]
name = "systema_shared_c"
crate-type = ["rlib", "cdylib", "staticlib"]

[dependencies]
libsystema-shared-rs = { path = "../libsystema-shared-rs" }
anyhow.workspace = true
async-trait.workspace = true
bytes.workspace = true
prost.workspace = true
serde_json.workspace = true
tokio.workspace = true

[build-dependencies]
cbindgen = "0.27"
