[package]
name = "libsystema-shared-rs"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

# The package name already starts with "lib", but rustc always prefixes a
# library artifact with "lib" on Unix.  Naming the target without that prefix
# yields `libsystema_shared.rlib` instead of `liblibsystema_shared_rs.rlib`.
[lib]
name = "systema_shared"

[dependencies]
prost.workspace = true
serde.workspace = true
serde_json.workspace = true
bytes.workspace = true
tokio.workspace = true
tokio-util.workspace = true
futures.workspace = true
anyhow.workspace = true
tracing.workspace = true
async-trait.workspace = true
libc = "0.2"

[dev-dependencies]
serde_json.workspace = true

[build-dependencies]
prost-build = "0.13"
