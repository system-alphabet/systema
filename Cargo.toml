[workspace]
members = [
    "crates/libsysa",
    "crates/backend/systema-sysi",
    "crates/backend/systema-sysf",
    "crates/backend/systema-sysf/systema-sysf-systemd",
    "crates/backend/systema-sysa",
    "crates/backend/systema-syss",
    "crates/backend/systema-syst",
    "crates/backend/systema-sysk",
    "crates/backend/systema-sysc",
    "crates/backend/systema-sysd",
    "crates/backend/systema-sysn",
    "crates/backend/systema-syse",
    "crates/backend/systema-sysm/systema-sysm-common",
    "crates/backend/systema-sysm/systema-sysm.unix",
    "crates/backend/systema-sysm/systema-sysm.linux",
    "crates/backend/systema-sysr/systema-sysr-common",
    "crates/backend/systema-sysr/systema-sysr.linux",
    "crates/backend/systema-sysr/systema-sysr",
    "crates/backend/systema-sysw/systema-sysw-common",
    "crates/backend/systema-sysw/systema-sysw.systemd",
    "crates/sysa-pager",
    "crates/frontend/systema-stagingctl",
    "crates/frontend/systema-unitstatectl",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["System Alphabet Contributors"]
license = "MIT OR Apache-2.0"

[workspace.dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["codec"] }

# Serialization
prost = "0.13"
bytes = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# D-Bus
zbus = { version = "4", default-features = false, features = ["tokio"] }
zvariant = { version = "4" }

# Dependency graph
petgraph = "0.6"

# Unit file parsing
configparser = "3"

# Error handling
anyhow = "1"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Utilities
futures = "0.3"
async-trait = "0.1"
uuid = { version = "1", features = ["v4"] }
once_cell = "1"
parking_lot = "0.12"

# CLI argument parsing
clap = { version = "4", features = ["derive"] }

# Regex
regex = "1"

# Date/time (calendar schedule computation)
chrono = "0.4"

# Colored terminal output
colored = "2"

# inotify (Linux mount point monitoring)
inotify = "0.10"

# Internationalization
gettext-rs = { version = "0.7", features = ["gettext-system"] }

[profile.release]
strip = true
